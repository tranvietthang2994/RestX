name: Build and Deploy to VPS

on:
  push:
    branches:
      - "thang/deploy"
jobs:
  # JOB 1: BUILD & PUSH LÊN DOCKER HUB
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build API
      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./RestX.API/Dockerfile
          push: true
          tags: tranvietthangdev/restx-api:latest

      # Build UI
      - name: Build and Push UI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./RestX.UI/Dockerfile
          push: true
          tags: tranvietthangdev/restx-ui:latest

  # JOB 2: SSH VÀO VPS ĐỂ UPDATE
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Bắt đầu deploy..."
            cd ~/restx-deploy/RestX
            
            # 1. Lấy file docker-compose.yml mới nhất
            git pull origin thang/deploy
            
            # 2. Kéo image mới nhất từ Docker Hub
            docker compose pull
            
            # 3. Dựng lại container
            docker compose up -d
            
            # 4. Xóa image cũ cho sạch ổ cứng
            docker image prune -f
            echo "✅ Deploy thành công!"